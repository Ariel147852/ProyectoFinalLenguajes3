<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Iniciar Sesión</h2>
      <p>Accede para solicitar préstamos y prestar herramientas</p>
    </div>

    <!-- Tarjetas de Acceso Rápido para Pruebas -->
    <div class="demo-box">
      <div class="demo-box-header">
        <span class="demo-icon">⚡</span>
        <span>Acceso Rápido de Prueba (1 Clic)</span>
      </div>
      <div class="demo-btn-grid">
        <button type="button" (click)="quickLogin('admin')" class="btn-demo btn-demo-admin" title="Entrar como Administrador General">
          👑 Admin
        </button>
        <button type="button" (click)="quickLogin('carlos')" class="btn-demo btn-demo-carlos" title="Entrar como Carlos Mendoza (Dueño)">
          🛠️ Carlos
        </button>
        <button type="button" (click)="quickLogin('lucia')" class="btn-demo btn-demo-lucia" title="Entrar como Lucía Benítez (Prestataria)">
          🙋‍♀️ Lucía
        </button>
      </div>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="ejemplo@vecino.org"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        @if (isLoading) {
          <span>Iniciando sesión...</span>
        } @else {
          <span>Ingresar</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes una cuenta aún? <a routerLink="/register">Regístrate gratis</a></p>
    </div>
  </div>
</div>
