<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Crear Cuenta Comunitaria</h2>
      <p>Únete a la red de préstamo de herramientas de tu barrio</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="nombre"
          placeholder="Ej: Lucía Benítez"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="lucia@vecina.org"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 6 caracteres"
          required
        />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono / WhatsApp (Opcional)</label>
        <input
          type="tel"
          id="telefono"
          name="telefono"
          [(ngModel)]="telefono"
          placeholder="0991234567"
        />
      </div>

      <div class="form-group">
        <label for="direccionZona">Barrio / Sector</label>
        <input
          type="text"
          id="direccionZona"
          name="direccionZona"
          [(ngModel)]="direccionZona"
          placeholder="Ej: Sector La Floresta"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        @if (isLoading) {
          <span>Creando cuenta...</span>
        } @else {
          <span>Registrarme</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
